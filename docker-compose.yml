services:
  api:
    build:
      context: ./apps/api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/askel
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
  worker:
    build:
      context: ./apps/api
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/askel
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  web:
    image: node:22-alpine
    working_dir: /src
    volumes:
      - ./apps/web:/src
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      API_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      - api
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: askel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d askel"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
